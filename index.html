<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff4fa3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kawaii Stock · Inventario y ventas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff4fa3;--pink2:#ffb3d9;--cyan:#22d3ee;--yellow:#ffd23f;--purple:#7c3aed;--green:#16c784;--red:#ff2d55;
  --ink:#2a1650;--paper:#fffaf5;--muted:#6b5a8e;--lilac:#f3e8ff;
  --f1:'M PLUS Rounded 1c',system-ui,sans-serif;--f2:'Mochiy Pop One','M PLUS Rounded 1c',system-ui,sans-serif;
  --r:18px;--sh:4px 4px 0 var(--ink);--nav:68px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:500 15px/1.45 var(--f1);color:var(--ink);
  background:radial-gradient(rgba(124,58,237,.13) 1.3px,transparent 1.5px) 0 0/15px 15px,
             linear-gradient(160deg,#ffe0f0 0%,#ece3ff 50%,#d6f6ff 100%) fixed;
  min-height:100%;overscroll-behavior-y:contain}
h1,h2,h3{font-family:var(--f2);font-weight:400;margin:0;line-height:1.2}
h3{font-size:1.02rem;margin-bottom:10px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;outline:none;min-width:0}
input:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink2)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-weight:800;font-size:.82rem;color:var(--muted)}
label>input,label>textarea{margin-top:4px;color:var(--ink);font-weight:600;font-size:15px}
small{color:var(--muted)}

/* ---------- Layout ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  color:#fff;border-bottom:3px solid var(--ink);
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.13) 0 2px,transparent 2px 22px),linear-gradient(100deg,var(--pink),var(--purple))}
.top h1{font-size:1.15rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 0 var(--ink)}
.logo{font-size:1.4rem;filter:drop-shadow(2px 2px 0 var(--ink));animation:spin 6s linear infinite}
.pill{font:800 .72rem var(--f1);background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:3px 9px;white-space:nowrap}
.pill.off{background:var(--yellow)}
#hdrMascot .mascot{width:48px;margin:-6px 0 -10px}
#bubble{position:fixed;z-index:60;top:calc(64px + env(safe-area-inset-top,0px));right:12px;max-width:min(78vw,320px);background:#fff;border:2.5px solid var(--ink);border-radius:16px;
  padding:9px 13px;font-weight:700;box-shadow:var(--sh);opacity:0;transform:translateY(-8px) scale(.9);transition:.25s;pointer-events:none}
#bubble::before{content:'';position:absolute;top:-10px;right:22px;border:8px solid transparent;border-bottom-color:var(--ink)}
#bubble.show{opacity:1;transform:none}
main{padding:14px;padding-bottom:calc(var(--nav) + 26px + var(--safe-b));max-width:1200px;margin:0 auto}

.nav{position:fixed;z-index:40;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;
  background:#fff;border-top:3px solid var(--ink)}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 .68rem var(--f1);color:var(--muted);position:relative;cursor:pointer}
.nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--pink)}
.nav button.on svg{transform:translateY(-2px) scale(1.1);filter:drop-shadow(0 2px 0 var(--pink2))}
.nav .big{flex:none;width:76px}
.nav .big .ic{width:58px;height:58px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border:3px solid var(--ink);box-shadow:var(--sh)}
.cnt{position:absolute;top:4px;right:calc(50% - 30px);min-width:21px;height:21px;border-radius:99px;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);font:800 .72rem/17px var(--f1);text-align:center;padding:0 4px}
.cnt:empty{display:none}
body.nologin .nav{display:none}

/* Orientación horizontal: barra lateral */
@media (orientation:landscape) and (min-width:640px){
  :root{--nav:0px}
  .nav{top:0;right:auto;width:92px;height:auto;flex-direction:column;justify-content:center;gap:6px;border-top:0;border-right:3px solid var(--ink);padding:70px 0 var(--safe-b)}
  .nav button{flex:none;height:64px}
  .nav .big{width:auto;height:84px}
  .nav .big .ic{margin-top:0}
  .top,main{margin-left:92px}
  body.nologin .top,body.nologin main{margin-left:0}
  main{padding-bottom:30px}
}

/* ---------- Componentes ---------- */
.card{background:#fff;border:2.5px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2.5px solid var(--ink);background:#fff;border-radius:99px;padding:10px 16px;font-weight:800;
  box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;white-space:nowrap;text-decoration:none;user-select:none}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.pri{background:linear-gradient(135deg,var(--pink),#ff7ac0);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn.ok{background:var(--green);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn.danger{background:#ffe1e8;color:#b0103a}
.btn.ghost{box-shadow:none;border-style:dashed}
.btn.sm{padding:6px 11px;font-size:.82rem}
.btn:disabled{opacity:.45;pointer-events:none}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.row-btns.sm .btn{padding:7px 11px;font-size:.8rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--ink);background:#fff;border-radius:99px;padding:6px 13px;font-weight:800;font-size:.82rem;cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.seg{display:flex;border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;border:0;background:#fff;padding:10px 6px;font-weight:800;cursor:pointer}
.seg button+button{border-left:2.5px solid var(--ink)}
.seg button.on{background:var(--cyan)}
.badge{display:inline-block;font:800 .75rem var(--f1);padding:3px 9px;border-radius:99px;border:2px solid var(--ink);background:var(--green);color:#fff}
.st-bajo{background:var(--yellow);color:var(--ink)}
.st-agotado{background:var(--red)}
.tag{display:inline-block;font-weight:800;font-size:.75rem;padding:3px 9px;border-radius:99px;background:var(--lilac);border:2px solid var(--ink)}
.hint{font-size:.82rem;font-weight:700;color:var(--purple);margin:6px 0}
.empty{text-align:center;color:var(--muted);padding:20px 10px;font-weight:700}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:2.5px solid var(--ink);border-radius:99px;padding:0 6px 0 14px;box-shadow:3px 3px 0 var(--ink)}
.search input{border:0;box-shadow:none!important;padding:11px 6px}
.two,.three{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:10px}
.three{grid-template-columns:1fr 1fr 1fr}
@media (max-width:420px){.three{grid-template-columns:1fr 1fr}.three>:last-child{grid-column:1/-1}}
.field{margin-bottom:10px}
.step{display:inline-flex;align-items:center;border:2.5px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.step button{border:0;background:var(--lilac);width:36px;height:34px;font-size:1.1rem;font-weight:800;cursor:pointer}
.step span{min-width:34px;text-align:center;font-weight:800}

/* ---------- Fotos con marcas de piezas ---------- */
.box{aspect-ratio:1;display:grid;place-items:center;overflow:hidden;border-radius:14px;background:repeating-conic-gradient(#fff0f8 0 25%,#fff 0 50%) 0 0/18px 18px}
.box.big{width:min(100%,60vh);margin:0 auto;border:2.5px solid var(--ink)}
.ph{position:relative;aspect-ratio:var(--ar,1);width:min(100%,calc(var(--ar,1) * 100%));container-type:inline-size}
.ph img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pz{position:absolute;transform:translate(-50%,-50%);width:calc(var(--ms,9) * 1cqw);min-width:16px;aspect-ratio:1;padding:0;border-radius:50%;
  background:var(--pink);color:#fff;border:2px solid #fff;box-shadow:0 0 0 2px var(--ink);display:grid;place-items:center;
  font:800 calc(var(--ms,9) * .48cqw)/1 var(--f1);pointer-events:none;transition:transform .12s}
.pz.off{background:rgba(30,10,55,.55);color:rgba(255,255,255,.55)}
.pz.off::before,.pz.off::after{content:'';position:absolute;left:4%;right:4%;top:50%;height:17%;background:var(--red);border-radius:9px;transform:translateY(-50%) rotate(45deg);box-shadow:0 0 0 1px #fff}
.pz.off::after{transform:translateY(-50%) rotate(-45deg)}
.pz.sel{background:var(--yellow);color:var(--ink);box-shadow:0 0 0 2px var(--ink),0 0 0 5px var(--yellow);transform:translate(-50%,-50%) scale(1.12)}
.box.inter .pz{pointer-events:auto;cursor:pointer}
.box.edit .ph{touch-action:none;cursor:crosshair}
.nofoto{display:grid;place-items:center;text-align:center;font-size:2.4rem;gap:4px;color:var(--muted);padding:10px}
.nofoto span{font:800 .8rem var(--f1)}

/* ---------- Mascota anime ---------- */
.mascot{width:64px;flex:none;cursor:pointer;touch-action:manipulation}
.mascot svg{display:block;width:100%;height:auto;overflow:visible}
.mascot.lg{width:min(36vw,160px);animation:float 3.2s ease-in-out infinite}
.mascot .lid{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.mascot .pup{transition:transform .12s}
.mascot .hap,.mascot .m-happy,.mascot .m-sad{display:none}
.mascot[data-mood=happy] .hap,.mascot[data-mood=happy] .m-happy,.mascot[data-mood=sad] .m-sad{display:inline}
.mascot[data-mood=happy] .eye,.mascot[data-mood=happy] .m-idle,.mascot[data-mood=sad] .m-idle{display:none}
.mascot.bounce svg,.mascot.bounce img{animation:boing .6s}
.mascot img{display:block;width:100%;height:auto;filter:drop-shadow(2px 3px 0 rgba(42,22,80,.3));user-select:none;-webkit-user-drag:none}
.av img{width:100%;height:76px;object-fit:contain;display:block}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes float{50%{transform:translateY(-7px)}}
@keyframes boing{30%{transform:scale(1.15,.85)}60%{transform:scale(.92,1.1) translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Inicio ---------- */
.dash{display:grid;gap:14px}
.hero{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#fff 40%,#ffe6f3);overflow:hidden;position:relative}
.hero::after{content:'✦ ✧ ✦';position:absolute;right:12px;top:6px;color:var(--pink);font-size:1.1rem;letter-spacing:4px}
.hero h2{font-size:1.2rem}
.hero p{margin:6px 0 0;font-weight:700;color:var(--muted)}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi{padding:11px 12px;border-radius:16px;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#fff;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;inset:0 auto 0 0;width:7px;background:var(--c)}
.kpi small{display:block;font-weight:800;padding-left:6px}
.kpi b{display:block;font:400 1.15rem var(--f2);padding-left:6px;margin:2px 0;word-break:break-word}
.kpi span{font-size:.75rem;font-weight:700;color:var(--muted);padding-left:6px}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:16px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar i{display:block;width:100%;max-width:38px;border:2px solid var(--ink);border-radius:9px 9px 3px 3px;background:linear-gradient(var(--pink),var(--purple));min-height:4px}
.bar i.today{background:linear-gradient(var(--yellow),var(--pink))}
.bar small{font-weight:800;font-size:.7rem}
.bar em{font-style:normal;font-size:.62rem;font-weight:800;color:var(--purple)}
.mini{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed var(--lilac);cursor:pointer}
.mini:last-child{border:0}
.mini .thumb{width:46px;flex:none}
.mini div:nth-child(2){flex:1;min-width:0}
.mini b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:760px),(orientation:landscape) and (min-width:640px){
  .dash{grid-template-columns:1fr 1fr}.dash .hero,.dash .kpis{grid-column:1/-1}
}

/* ---------- Inventario ---------- */
.toolbar{position:sticky;top:64px;z-index:5;padding:2px 0 4px;background:linear-gradient(#ece3ffee 70%,transparent)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.prod{padding:8px;position:relative;cursor:pointer;transition:transform .15s}
.prod:active{transform:scale(.97)}
.prod .badge{position:absolute;top:13px;left:13px}
.prod .pinfo{padding:8px 2px 0}
.prod .pinfo b{display:block;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.prod .price{font:400 1rem var(--f2);color:var(--pink);text-shadow:1px 1px 0 var(--ink)}
.prod .price small{display:block;font:800 .78rem var(--f1);color:var(--purple);text-shadow:none}
.prod .settag{position:absolute;top:13px;right:13px;background:var(--cyan);border:2px solid var(--ink);border-radius:99px;font:800 .7rem var(--f1);padding:2px 7px}
.fab{position:fixed;z-index:20;right:18px;bottom:calc(var(--nav) + 18px + var(--safe-b));width:62px;height:62px;border-radius:50%;font-size:2rem;line-height:1;
  border:3px solid var(--ink);background:linear-gradient(135deg,var(--yellow),#ffa63f);box-shadow:var(--sh);cursor:pointer}

/* ---------- Sheets (ventanas) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;visibility:hidden}
.sheet-bg{position:absolute;inset:0;background:rgba(42,22,80,.45);opacity:0;transition:.25s}
.sheet{position:relative;width:100%;max-width:820px;max-height:92vh;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;
  padding:14px 16px calc(16px + var(--safe-b));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1.15)}
.sheet-wrap.open{visibility:visible}
.sheet-wrap.open .sheet-bg{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:sticky;top:-14px;background:var(--paper);padding:6px 0;z-index:3}
.sh-head h2{flex:1;font-size:1.1rem}
.x{border:2.5px solid var(--ink);background:#fff;border-radius:50%;width:36px;height:36px;font-weight:800;cursor:pointer;flex:none}
.sh-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px;position:sticky;bottom:calc(-16px - var(--safe-b));background:var(--paper);padding:10px 0}
.det,.ed{display:grid;gap:14px}
@media (orientation:landscape) and (min-width:640px),(min-width:820px){
  .sheet-wrap{align-items:center}
  .sheet{border-radius:26px;border-bottom:3px solid var(--ink);max-height:94vh}
  .det,.ed{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .det-photo,.ed-photo{position:sticky;top:44px}
}
.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.prices div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px;text-align:center}
.prices small{display:block;font-weight:800;font-size:.68rem}
.prices b{font-size:.92rem}
.prices .hl{background:var(--pink2)}
.neg{color:#d00}
.notas{background:var(--lilac);border-radius:12px;padding:8px 10px;font-weight:600;margin:8px 0;white-space:pre-wrap}
.qtyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.adj{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:2px dashed var(--lilac)}
.adj label{flex:1 1 120px}
.calc{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:-2px 0 10px;font-weight:800;font-size:.85rem}
.pz-list{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pzchip{border:2px solid var(--ink);background:var(--pink);color:#fff;border-radius:99px;padding:4px 10px;font-weight:800;font-size:.78rem;cursor:pointer}
.pzchip.off{background:#9a8fb0;text-decoration:line-through}
.pzchip.on{background:var(--yellow);color:var(--ink)}
.pz-panel{margin-top:8px;padding:10px;box-shadow:3px 3px 0 var(--ink)}
.gal{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px}
.gth{position:relative;flex:none;width:76px;aspect-ratio:1;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer}
.gth img{width:100%;height:100%;object-fit:cover;display:block}
.gth.cover{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink2)}
.gth em{position:absolute;left:0;right:0;bottom:0;background:var(--pink);color:#fff;font:800 .6rem/1.7 var(--f1);font-style:normal;text-align:center}
.gb{position:absolute;top:3px;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:.75rem;line-height:1;padding:0;cursor:pointer}
.gb.star{left:3px}.gb.del{right:3px}
#visor{position:fixed;inset:0;z-index:66;background:#1a0b33f2;display:grid;place-items:center;padding:56px 12px}
#visor[hidden]{display:none}
#visor img{max-width:100%;max-height:100%;border:3px solid #fff;border-radius:14px}
#visor .x{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px}
#visor .vn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;font-size:1.4rem;font-weight:800;cursor:pointer}
#visor .vn.prev{left:10px}#visor .vn.next{right:10px}
#visor small{position:absolute;bottom:calc(14px + var(--safe-b));color:#fff;font-weight:800}
.tk{display:grid;place-items:center;padding:4px 0 8px}
.tk img{width:min(100%,380px);height:auto;filter:drop-shadow(4px 4px 0 var(--ink))}
.check{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:.9rem;margin:4px 0 6px}
.check input{width:22px;height:22px;margin:0;accent-color:var(--pink)}
.slider{display:flex;align-items:center;gap:10px;margin-top:8px}
.slider input{padding:0;border:0;box-shadow:none!important;accent-color:var(--pink)}

/* ---------- Vender ---------- */
.cart{display:grid;gap:14px}
@media (min-width:860px),(orientation:landscape) and (min-width:640px){.cart{grid-template-columns:1.2fr 1fr;align-items:start}.cart>*{grid-column:1}.cart .cobro{position:sticky;top:76px;grid-row:1/span 2;grid-column:2}}
.res{display:grid;gap:8px;margin-top:10px;max-height:300px;overflow:auto}
.res.grid{max-height:none;overflow:visible;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.res .empty{grid-column:1/-1}
.crop-wrap{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;gap:8px;background:#1a0b33;color:#fff;padding:max(12px,env(safe-area-inset-top)) 12px calc(12px + var(--safe-b))}
.crop-wrap[hidden]{display:none}
.crop-head{display:grid;gap:2px;text-align:center}
.crop-head small{color:#d9c8ff;font-weight:700}
.crop-head .chips{justify-content:safe center}
.crop-wrap .btn,.crop-wrap .chip:not(.on){color:var(--ink)}
.crop-foot .ghost{background:transparent;color:#fff!important;border-color:#fff}
.crop-stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.crop-in{position:relative;line-height:0}
.crop-in img{display:block;max-width:calc(100vw - 24px);max-height:calc(100vh - 200px);user-select:none;-webkit-user-drag:none;pointer-events:none}
.crop-box{position:absolute;border:2.5px solid #fff;box-shadow:0 0 0 9999px rgba(20,8,45,.65);touch-action:none;cursor:move;
  background:linear-gradient(#fff7 0 0) 33.33% 0/1px 100% no-repeat,linear-gradient(#fff7 0 0) 66.66% 0/1px 100% no-repeat,
             linear-gradient(#fff7 0 0) 0 33.33%/100% 1px no-repeat,linear-gradient(#fff7 0 0) 0 66.66%/100% 1px no-repeat}
.crop-box i{position:absolute;width:30px;height:30px;border:5px solid var(--pink)}
.crop-box i[data-h=nw]{left:-7px;top:-7px;border-right:0;border-bottom:0;cursor:nwse-resize}
.crop-box i[data-h=ne]{right:-7px;top:-7px;border-left:0;border-bottom:0;cursor:nesw-resize}
.crop-box i[data-h=sw]{left:-7px;bottom:-7px;border-right:0;border-top:0;cursor:nesw-resize}
.crop-box i[data-h=se]{right:-7px;bottom:-7px;border-left:0;border-top:0;cursor:nwse-resize}
.crop-box span{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:var(--pink);border:2px solid var(--ink);border-radius:99px;padding:2px 9px;font:800 .7rem/1.4 var(--f1);white-space:nowrap;pointer-events:none}
.crop-foot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:2px dashed var(--lilac)}
.line:last-child{border:0}
.line .thumb{width:62px;flex:none}
.li-main{flex:1;min-width:0}

/* ---------- Ventas ---------- */
.day{font:400 .9rem var(--f2);margin:16px 4px 8px;color:var(--purple)}

/* ---------- Ajustes / login ---------- */

  background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-weight:800;max-width:90vw;text-align:center;pointer-events:none;border:2.5px solid #fff}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
'use strict';
/* =========================================================================
   CONFIGURACIÓN OPCIONAL
   Pega aquí el objeto firebaseConfig de tu proyecto para que TODOS los
   dispositivos que abran la página se conecten solos a la nube.
   Si lo dejas en null, puedes pegarlo desde Ajustes en cada dispositivo.
   ========================================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAuXVYMkRh6n84pYR0T8XXqpgC96jWbkIw",
  authDomain: "kawaiistock-646ac.firebaseapp.com",
  projectId: "kawaiistock-646ac",
  storageBucket: "kawaiistock-646ac.firebasestorage.app",
  messagingSenderId: "148783175939",
  appId: "1:148783175939:web:bc4df3c5c1c2b26d93f136"
};
const FIREBASE_SDK = '10.12.2';
/* Para un SEGUNDO NEGOCIO en el mismo sitio de GitHub (otra carpeta), pon aquí un nombre corto, p. ej. 'negocio2'.
   Así sus ajustes, ticket en curso y datos locales no se mezclan con los de esta tienda. */
const NEGOCIO = '';
const K = s => NEGOCIO ? `${s}_${NEGOCIO}` : s;

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const r2 = n => Math.round(num(n) * 100) / 100;
const fmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
const money = n => fmt.format(num(n));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sumBy = (a, f) => a.reduce((s, x) => s + num(f(x)), 0);
const dia = (t = Date.now(), menos = 0) => { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - menos); return d.getTime(); };
const inicioMes = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };
const fechaTxt = t => new Date(t).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' });
const hoyISO = () => new Date().toISOString().slice(0, 10);
const clean = o => JSON.parse(JSON.stringify(o));

/* ---------- Configuración y estado ---------- */
const CFG_KEY = K('ks_cfg');
const cfg = Object.assign({ tienda: 'Kawaii Stock', avatar: 'midori', margen: 40, modo: FIREBASE_CONFIG ? 'firebase' : 'local', fb: null },
  JSON.parse(localStorage.getItem(CFG_KEY) || '{}'));
cfg.fb = cfg.fb || FIREBASE_CONFIG;
// Con la configuración escrita en el código, la nube manda salvo que el usuario haya elegido otro modo en Ajustes.
if (FIREBASE_CONFIG && !cfg.modoManual) { cfg.modo = 'firebase'; cfg.fb = FIREBASE_CONFIG; }
const saveCfg = () => localStorage.setItem(CFG_KEY, JSON.stringify(cfg));

const S = {
  productos: new Map(), ventas: [], view: 'inicio', q: '', cat: '', est: '', rango: 'hoy',
  user: null, listo: false, fatal: '', sheet: null, tienda: {}, galCache: new Map(),
  carrito: JSON.parse(localStorage.getItem(K('ks_cart')) || '[]'),
  cobro: { desc: '', metodo: 'Efectivo', cliente: '', nota: '' }
};
const tiendaNombre = () => S.tienda.nombre || cfg.tienda || 'Kawaii Stock';
const saveCart = () => { localStorage.setItem(K('ks_cart'), JSON.stringify(S.carrito)); badge(); };

/* ---------- Reglas de producto ---------- */
const esSet = p => p.tipo === 'set';
const stockDe = p => esSet(p) ? (p.piezas || []).filter(z => !z.vendida).length : num(p.stock);
const precioDe = p => num(p.precioVenta) || num(p.precioSugerido);
const nPz = p => Math.max(1, (p.piezas || []).length);
const precioPieza = (p, z) => z.precio !== '' && z.precio != null ? num(z.precio) : r2(precioDe(p) / nPz(p));
const costoPieza = p => r2(num(p.costo) / nPz(p));
const margen = p => { const pv = precioDe(p); return pv ? (pv - num(p.costo)) / pv * 100 : 0; };
const estado = p => { const s = stockDe(p); return s <= 0 ? 'agotado' : s <= num(p.stockMin) ? 'bajo' : 'ok'; };
const categorias = () => [...new Set([...S.productos.values()].map(p => (p.categoria || '').trim()).filter(Boolean))].sort();
const ventasOk = () => S.ventas.filter(v => v.estado !== 'cancelada');

/* Aplica (dir=-1) o revierte (dir=+1) una venta sobre los productos. Lógica compartida local / nube. */
function aplicarVenta(prods, venta, dir) {
  for (const it of venta.items) {
    const p = prods[it.pid];
    if (!p) { if (dir < 0) throw new Error(`"${it.nombre}" ya no existe`); continue; }
    if (it.piezas) {
      for (const id of it.piezas) {
        const z = (p.piezas || []).find(z => z.id === id);
        if (!z) { if (dir < 0) throw new Error(`Una pieza de "${p.nombre}" ya no existe`); continue; }
        if (dir < 0 && z.vendida) throw new Error(`La pieza #${p.piezas.indexOf(z) + 1} de "${p.nombre}" ya no está disponible`);
        z.vendida = dir < 0;
      }
      p.stock = stockDe(p);
    } else {
      const s = num(p.stock) + dir * it.cant;
      if (s < 0) throw new Error(`Stock insuficiente de "${p.nombre}" (quedan ${num(p.stock)})`);
      p.stock = s;
    }
    p.actualizado = Date.now();
  }
  return Object.values(prods).map(p => ['productos', p]);
}

/* ---------- Capa de datos ---------- */
function onData(p, v) {
  S.productos = new Map(p.map(x => [x.id, x]));
  S.ventas = v.filter(Boolean).sort((a, b) => b.fecha - a.fecha);
  S.listo = true;
  if (S.view === 'inventario' && $('#grid')) renderGrid(); else if (S.view !== 'vender' || !$('#ticket')) render(); else { renderTicket(); renderRes(); }
  if (S.sheet?.live) drawSheet();
}
function setTienda(t) {
  S.tienda = t || {};
  if (S.tienda.nombre && S.tienda.nombre !== cfg.tienda) { cfg.tienda = S.tienda.nombre; saveCfg(); }
  $('#storeName').textContent = tiendaNombre();
  if (S.view === 'ajustes' && !document.activeElement?.dataset?.t) render();
}
let avisado = false;
const avisoReglas = () => { if (!avisado) { avisado = true; toast('Actualiza las reglas de Firestore para fotos extra y ticket (ver README)', 'warn'); } };
const errMsg = e => e.code === 'permission-denied' ? 'Sin permiso: actualiza las reglas de Firestore' : e.message;
async function atomicMem(pids, fn, commit) {
  const prods = {};
  pids.forEach(id => { const p = S.productos.get(id); if (p) prods[id] = structuredClone(p); });
  return commit(fn(prods));
}

const STORES = ['productos', 'ventas', 'fotos', 'config'];
const idb = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(K('kawaii-stock'), 2);
      r.onupgradeneeded = () => STORES.forEach(s => r.result.objectStoreNames.contains(s) || r.result.createObjectStore(s, { keyPath: 'id' }));
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  run(fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(STORES, 'readwrite');
      fn(s => t.objectStore(s));
      t.oncomplete = res; t.onerror = t.onabort = () => rej(t.error || new Error('Error al guardar'));
    });
  },
  all(store) {
    return new Promise((res, rej) => {
      const r = this.db.transaction(store).objectStore(store).getAll();
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  }
};

const Local = {
  nombre: 'Local 💾',
  async init() { await idb.open(); setTienda((await idb.all('config')).find(c => c.id === 'tienda')); onData(await idb.all('productos'), await idb.all('ventas')); },
  async commit(puts, dels = []) {
    await idb.run(st => { puts.forEach(([s, o]) => st(s).put(clean(o))); dels.forEach(([s, id]) => st(s).delete(id)); });
    const m = { productos: new Map(S.productos), ventas: new Map(S.ventas.map(v => [v.id, v])) };
    puts.forEach(([s, o]) => s === 'config' ? setTienda(o) : m[s]?.set(o.id, o)); dels.forEach(([s, id]) => m[s]?.delete(id));
    onData([...m.productos.values()], [...m.ventas.values()]);
  },
  atomic(pids, fn) { return atomicMem(pids, fn, puts => this.commit(puts)); },
  async fotosDe(pid) { return (await idb.all('fotos')).filter(f => f.pid === pid); },
  todasFotos() { return idb.all('fotos'); },
  async borrarTodo() { await idb.run(st => STORES.forEach(s => st(s).clear())); setTienda({}); onData([], []); }
};

const FB = {
  nombre: 'Nube ☁️', auth: null, unsub: [],
  async init() {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK}/`;
    const [A, F, U] = await Promise.all(['firebase-app', 'firebase-firestore', 'firebase-auth'].map(m => import(base + m + '.js')));
    this.F = F; this.U = U;
    const app = A.initializeApp(cfg.fb);
    try { this.db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
    catch { this.db = F.getFirestore(app); }
    this.auth = U.getAuth(app);
    await new Promise(res => U.onAuthStateChanged(this.auth, user => {
      S.user = user; this.unsub.forEach(f => f()); this.unsub = [];
      S.listo = false; S.productos = new Map(); S.ventas = [];
      if (user) this.listen();
      render(); res();
    }));
  },
  listen() {
    const { F, db } = this; let p = null, v = null;
    const emit = () => p && v && onData(p, v);
    const err = e => { console.error(e); toast(e.code === 'permission-denied' ? 'Sin permiso: revisa las reglas de Firestore' : 'Error de nube: ' + e.message, 'err'); };
    this.unsub.push(F.onSnapshot(F.collection(db, 'productos'), s => { p = s.docs.map(d => d.data()); emit(); }, err));
    this.unsub.push(F.onSnapshot(F.query(F.collection(db, 'ventas'), F.orderBy('fecha', 'desc'), F.limit(2000)), s => { v = s.docs.map(d => d.data()); emit(); }, err));
    this.unsub.push(F.onSnapshot(F.doc(db, 'config', 'tienda'), s => setTienda(s.data()), e => e.code === 'permission-denied' ? avisoReglas() : console.error(e)));
  },
  async leerFotos(q) {
    try { return (await this.F.getDocs(q)).docs.map(d => d.data()); }
    catch (e) { e.code === 'permission-denied' ? avisoReglas() : console.error(e); return []; }
  },
  fotosDe(pid) { const { F, db } = this; return this.leerFotos(F.query(F.collection(db, 'fotos'), F.where('pid', '==', pid))); },
  todasFotos() { return this.leerFotos(this.F.collection(this.db, 'fotos')); },
  async commit(puts, dels = []) {
    const { F, db } = this;
    const ops = [...puts.map(([s, o]) => [b => b.set(F.doc(db, s, o.id), clean(o)), JSON.stringify(o).length]),
                 ...dels.map(([s, id]) => [b => b.delete(F.doc(db, s, id)), 100])];
    const pend = []; let b = F.writeBatch(db), n = 0, sz = 0;
    for (const [op, size] of ops) {
      if (n && (n >= 450 || sz + size > 8e6)) { pend.push(b.commit()); b = F.writeBatch(db); n = 0; sz = 0; }
      op(b); n++; sz += size;
    }
    if (n) pend.push(b.commit());
    // Sin internet la escritura queda en cola local y se sincroniza sola al reconectar.
    if (!navigator.onLine) { Promise.all(pend).catch(e => toast('Error al sincronizar: ' + e.message, 'err')); toast('Guardado sin conexión · se sincronizará ☁️', 'warn'); return; }
    await Promise.all(pend);
  },
  atomic(pids, fn) {
    if (!navigator.onLine) return atomicMem(pids, fn, puts => this.commit(puts));
    const { F, db } = this;
    return F.runTransaction(db, async tx => {
      const prods = {};
      for (const id of pids) { const s = await tx.get(F.doc(db, 'productos', id)); if (s.exists()) prods[id] = s.data(); }
      fn(prods).forEach(([s, o]) => tx.set(F.doc(db, s, o.id), clean(o)));
    });
  },
  login(e, p) { return this.U.signInWithEmailAndPassword(this.auth, e, p); },
  logout() { return this.U.signOut(this.auth); },
  reset(e) { return this.U.sendPasswordResetEmail(this.auth, e); }
};

let DB = Local;
/* Fotos adicionales: se guardan aparte (colección "fotos") para no rebasar el límite de 1 MB por producto. */
const MAX_FOTOS = 8;
async function galeria(pid) {
  if (!S.galCache.has(pid)) S.galCache.set(pid, (await DB.fotosDe(pid)).sort((a, b) => a.t - b.t));
  return S.galCache.get(pid);
}
const pidsDe = v => [...new Set(v.items.map(i => i.pid))];
const Ops = {
  guardar: (p, put = [], del = []) => { S.galCache.delete(p.id); return DB.commit([['productos', p], ...put.map(f => ['fotos', f])], del.map(id => ['fotos', id])); },
  eliminar: async id => { const fs = await galeria(id); S.galCache.delete(id); return DB.commit([], [['productos', id], ...fs.map(f => ['fotos', f.id])]); },
  guardarTienda: t => DB.commit([['config', { ...t, id: 'tienda' }]]),
  vender: v => DB.atomic(pidsDe(v), prods => [...aplicarVenta(prods, v, -1), ['ventas', v]]),
  cancelar: v => DB.atomic(pidsDe(v), prods => [...aplicarVenta(prods, v, 1), ['ventas', { ...v, estado: 'cancelada', canceladaEn: Date.now() }]]),
  ajustar: (id, delta) => DB.atomic([id], prods => {
    const p = prods[id]; if (!p) throw new Error('Producto no encontrado');
    const s = num(p.stock) + delta; if (s < 0) throw new Error(`No puedes dejar el stock en negativo (hay ${num(p.stock)})`);
    p.stock = s; p.actualizado = Date.now(); return [['productos', p]];
  }),
  marcar: (id, ids, vendida) => DB.atomic([id], prods => {
    const p = prods[id]; if (!p) throw new Error('Producto no encontrado');
    p.piezas.forEach(z => { if (ids.includes(z.id)) z.vendida = vendida; });
    p.stock = stockDe(p); p.actualizado = Date.now(); return [['productos', p]];

const cargarImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('No se pudo leer la imagen')); i.src = src; });

  const src = URL.createObjectURL(file);

    const img = await cargarImg(src);

      const sx = crop.x * img.naturalWidth, sy = crop.y * img.naturalHeight, sw = crop.w * img.naturalWidth, sh = crop.h * img.naturalHeight;
      const sc = Math.min(1, max / Math.max(sw, sh));

      c.width = Math.max(1, Math.round(sw * sc)); c.height = Math.max(1, Math.round(sh * sc));

}
/* Recortador: devuelve {x,y,w,h} en fracciones de la imagen, o null si se cancela. */
const ASPECTOS = [['1', '⬜ Cuadrada (tarjeta)'], ['0.75', '▯ 3:4'], ['1.3333', '▭ 4:3'], ['0', '✂️ Libre']];
function recortar(file) {
  return new Promise(resolve => {
    const w = $('#crop'), img = $('#cropImg'), box = $('#cropBox'), src = URL.createObjectURL(file);
    let f = { x: 0, y: 0, w: 1, h: 1 }, ar = 1, drag = null;
    const dim = () => img.getBoundingClientRect();
    const pinta = () => Object.assign(box.style, { left: f.x * 100 + '%', top: f.y * 100 + '%', width: f.w * 100 + '%', height: f.h * 100 + '%' });
    const centra = () => {
      const { width: W, height: H } = dim(); let bw = W * .92, bh = ar ? bw / ar : H * .92;
      if (bh > H * .92) { bh = H * .92; if (ar) bw = bh * ar; }
      f = { x: (W - bw) / 2 / W, y: (H - bh) / 2 / H, w: bw / W, h: bh / H }; pinta();
    };
    const chips = () => $('#cropAsp').innerHTML = ASPECTOS.map(([v, t]) => chip('cropAsp', v, t, +v === ar)).join('');
    box.onpointerdown = e => {
      const { width: W, height: H } = dim();
      drag = { h: e.target.dataset.h || '', sx: e.clientX, sy: e.clientY, W, H, s: { x: f.x * W, y: f.y * H, w: f.w * W, h: f.h * H } };

      else {
        const L = h.includes('w'), T = h.includes('n'), ax = L ? s.x + s.w : s.x, ay = T ? s.y + s.h : s.y;
        const px = (L ? s.x : s.x + s.w) + dx, py = (T ? s.y : s.y + s.h) + dy;
        let bw = clamp(L ? ax - px : px - ax, M, L ? ax : W - ax), bh = clamp(T ? ay - py : py - ay, M, T ? ay : H - ay);
        if (ar) { bh = bw / ar; const maxH = T ? ay : H - ay; if (bh > maxH) { bh = maxH; bw = bh * ar; } }
        r = { x: L ? ax - bw : ax, y: T ? ay - bh : ay, w: bw, h: bh };

/* Genera una imagen con las marcas "quemadas" + franja con nombre y precio, para WhatsApp/redes. */

      const x = z.x / 100 * W, y = z.y / 100 * H;
      g.beginPath(); g.arc(x, y, r, 0, 7);
      g.fillStyle = z.vendida ? 'rgba(30,10,55,.6)' : '#ff4fa3'; g.fill();
      g.lineWidth = r * .14; g.strokeStyle = '#fff'; g.stroke();

const STICKERS = {
  midori: { idle: 'm01', ticket: 'm09', happy: ['m02', 'm05', 'm06', 'm07', 'm09', 'm10'], party: ['m03', 'm11'], sad: ['m04', 'm08'] },
  shima: { idle: 'z13', ticket: 'z13', happy: ['z13', 'z15'], party: ['z14', 'z15'], sad: ['z16', 'z12'] }
};
const NOMBRES_AV = { midori: 'Midori', shima: 'Shima', mika: 'Mika', mochi: 'Mochi', kitsu: 'Kitsu' };
const esImg = k => !!STICKERS[k];
const avatarActual = () => NOMBRES_AV[cfg.avatar] ? cfg.avatar : 'midori';
const pose = (k, mood) => { const st = STICKERS[k], l = st[mood] || st.happy; return IMG[Array.isArray(l) ? l[Math.floor(Math.random() * l.length)] : l]; };
const avatarHTML = (k, mood = 'idle') => esImg(k) ? `<img src="${pose(k, mood)}" alt="${NOMBRES_AV[k]}">` : AVATARS[k];
const mascota = (size = '', mood = 'idle') => `<div class="mascot ${size}" data-act="poke" data-mood="${mood === 'party' ? 'happy' : mood}" role="button" aria-label="Mascota">${avatarHTML(avatarActual(), mood)}</div>`;
/* Cambia el ánimo de todas las mascotas visibles: en las de stickers cambia la imagen, en las dibujadas la cara. */
function animo(mood) {
  const k = avatarActual();
  $$('.mascot').forEach(m => { m.dataset.mood = mood === 'party' ? 'happy' : mood; const i = $('img', m); if (i && esImg(k)) i.src = pose(k, mood); });
}
const FRASES = ['¡Ganbatte! Hoy se vende todo 💪', 'Tip: una sola foto por set y marca las piezas 📸', '¿Ya revisaste lo que está por agotarse? ⚠️',
  'Puedes compartir la foto con las piezas tachadas 📤', 'Exporta un respaldo de vez en cuando 💾', '¡Nyaa~! Tócame otra vez ✨', 'Sube el precio con el botón 🪄 de margen'];
let sayT;
function say(txt, mood = 'happy', ms = 3200) {
  const b = $('#bubble'); b.textContent = txt; b.classList.add('show');
  animo(mood); $$('.mascot').forEach(m => { m.classList.remove('bounce'); void m.offsetWidth; m.classList.add('bounce'); });
  clearTimeout(sayT);
  sayT = setTimeout(() => { b.classList.remove('show'); animo('idle'); }, ms);
}
let rafEyes = 0;
addEventListener('pointermove', e => {
  if (rafEyes) return;
  rafEyes = requestAnimationFrame(() => {
    rafEyes = 0;
    $$('.mascot').forEach(m => {
      const r = m.getBoundingClientRect(); if (!r.width) return;
      const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), d = Math.hypot(dx, dy) || 1, k = Math.min(4, d / 40);
      $$('.pup', m).forEach(p => p.style.transform = `translate(${dx / d * k}px,${dy / d * k}px)`);
    });
  });
}, { passive: true });

/* ---------- UI genérica ---------- */
let toastT;
function toast(txt, tipo = '') {
  const t = $('#toast'); t.textContent = txt; t.className = 'show ' + tipo;
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 2800);
  if (tipo === 'err') { animo('sad'); clearTimeout(sayT); sayT = setTimeout(() => { $('#bubble').classList.remove('show'); animo('idle'); }, 2800); }
}
function confeti() {
  const cols = ['#ff4fa3', '#22d3ee', '#ffd23f', '#7c3aed', '#16c784'];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement('i'); s.className = 'conf';
    s.style.cssText = `left:${Math.random() * 100}vw;background:${cols[i % 5]};animation-delay:${Math.random() * .5}s;border-radius:${i % 3 ? 2 : 50}%`;
    document.body.append(s); setTimeout(() => s.remove(), 2600);
  }
}
const head = t => `<div class="sh-head"><h2>${t}</h2><button class="x" data-act="cerrar" aria-label="Cerrar">✕</button></div>`;
const kpi = (t, v, sub, c) => `<div class="kpi" style="--c:${c}"><small>${t}</small><b>${v}</b><span>${sub}</span></div>`;
const chip = (act, v, txt, on) => `<button class="chip${on ? ' on' : ''}" data-act="${act}" data-v="${esc(v)}">${txt}</button>`;
const field = (k, lbl, type, val, ph = '', extra = '') => type === 'textarea'
  ? `<label class="field">${lbl}<textarea data-f="${k}" placeholder="${ph}">${esc(val)}</textarea></label>`
  : `<label class="field">${lbl}<input data-f="${k}" type="${type}" ${type === 'number' ? 'inputmode="decimal" step="any" min="0"' : ''} value="${esc(val)}" placeholder="${ph}" ${extra}></label>`;
const sheetRoot = () => $('#sheet .sheet');
function openSheet(def) {
  S.sheet = def; drawSheet(true);
  const w = $('#sheet');
  if (!w.classList.contains('open')) { w.classList.add('open'); history.pushState({ sheet: 1 }, ''); }
}
function drawSheet(top) {
  if (!S.sheet) return;
  const r = sheetRoot(), st = r.scrollTop;
  r.innerHTML = S.sheet.html(); S.sheet.mount?.(r);
  r.scrollTop = top ? 0 : st;
}
function closeSheet(fromPop) {
  const w = $('#sheet'); if (!w.classList.contains('open')) return;
  w.classList.remove('open'); S.sheet = null;
  if (!fromPop && history.state?.sheet) history.back();
}
addEventListener('popstate', () => closeSheet(true));

/* ---------- Vistas ---------- */
const VIEWS = { inicio: vInicio, inventario: vInventario, vender: vVender, ventas: vVentas, ajustes: vAjustes };
const MOUNTS = { inventario: mInventario, vender: mVender, ajustes: mAjustes };
function render() {
  $('#storeName').textContent = tiendaNombre();
  document.title = `${tiendaNombre()} · Inventario`;
  $('#modePill').textContent = DB.nombre + (navigator.onLine ? '' : ' · sin red');
  $('#modePill').classList.toggle('off', !navigator.onLine);
  $('#hdrMascot').innerHTML = mascota();
  const login = DB === FB && !S.user && !S.fatal;
  document.body.classList.toggle('nologin', login && S.view !== 'ajustes');
  $$('.nav button').forEach(b => b.classList.toggle('on', b.dataset.go === S.view));
  const m = $('#main');
  if (S.view === 'ajustes') m.innerHTML = vAjustes();
  else if (S.fatal) m.innerHTML = vError();
  else if (login) m.innerHTML = vLogin();
  else if (!S.listo) m.innerHTML = `<div class="loader">${mascota('lg')}Cargando tu tienda…</div>`;
  else m.innerHTML = VIEWS[S.view]();
  if (S.view === 'ajustes' || (S.listo && !login && !S.fatal)) MOUNTS[S.view]?.();
  if (login && S.view !== 'ajustes') mLogin();
  badge();
}
function go(v) { S.view = v; closeSheet(); render(); scrollTo(0, 0); }
function badge() { $('#cartCnt').textContent = S.carrito.reduce((s, l) => s + l.cant, 0) || ''; }

function saludo() {
  const h = new Date().getHours(), n = S.user?.email ? ', ' + S.user.email.split('@')[0] : '';
  return (h < 12 ? 'おはよう ¡Buenos días' : h < 19 ? 'こんにちは ¡Buenas tardes' : 'こんばんは ¡Buenas noches') + n + '!';
}
function vInicio() {
  const ps = [...S.productos.values()], vs = ventasOk(), mes = inicioMes();
  const vHoy = vs.filter(v => v.fecha >= dia()), vMes = vs.filter(v => v.fecha >= mes);
  const bajos = ps.filter(p => estado(p) !== 'ok').sort((a, b) => stockDe(a) - stockDe(b));
  const unidades = sumBy(ps, stockDe);
  const valCosto = sumBy(ps, p => esSet(p) ? costoPieza(p) * stockDe(p) : num(p.costo) * stockDe(p));
  const valVenta = sumBy(ps, p => esSet(p) ? sumBy(p.piezas.filter(z => !z.vendida), z => precioPieza(p, z)) : precioDe(p) * stockDe(p));
  const ventaMes = sumBy(vMes, v => v.total), gananciaMes = sumBy(vMes, v => v.ganancia);
  const dias = [6, 5, 4, 3, 2, 1, 0].map(i => dia(Date.now(), i));
  const tot = dias.map((t, i) => sumBy(vs.filter(v => v.fecha >= t && v.fecha < (dias[i + 1] ?? Infinity)), v => v.total));
  const max = Math.max(...tot, 1);
  const top = {};
  vMes.forEach(v => v.items.forEach(it => { top[it.pid] ??= { nombre: it.nombre, cant: 0, imp: 0 }; top[it.pid].cant += it.cant; top[it.pid].imp += it.importe; }));
  const tops = Object.entries(top).sort((a, b) => b[1].imp - a[1].imp).slice(0, 5);
  const tip = !ps.length ? 'Empieza agregando tu primer producto ✨' : bajos.length ? `Tienes ${bajos.length} producto(s) por surtir ⚠️` : '¡Todo tu inventario está en orden! ✅';
  const mini = (p, extra) => `<div class="mini" data-act="ver" data-id="${p.id}"><div class="thumb">${fotoHTML(p)}</div><div><b>${esc(p.nombre)}</b><small>${extra}</small></div><span class="badge st-${estado(p)}">${stockDe(p)}</span></div>`;
  return `<div class="dash">
    <section class="card hero">${mascota('lg')}<div><h2>${esc(saludo())}</h2><p>${tip}</p>
      <div class="row-btns"><button class="btn pri" data-act="nuevo">＋ Producto</button><button class="btn" data-go="vender">🛒 Vender</button></div></div></section>
    <div class="kpis">
      ${kpi('Ventas hoy', money(sumBy(vHoy, v => v.total)), `${vHoy.length} ticket(s)`, 'var(--pink)')}
      ${kpi('Ventas del mes', money(ventaMes), `${vMes.length} ticket(s)`, 'var(--purple)')}
      ${kpi('Ganancia del mes', money(gananciaMes), ventaMes ? `margen ${(gananciaMes / ventaMes * 100).toFixed(0)}%` : '—', 'var(--green)')}
      ${kpi('Piezas en stock', unidades, `${ps.length} producto(s)`, 'var(--cyan)')}
      ${kpi('Inventario a costo', money(valCosto), `a precio de venta ${money(valVenta)}`, 'var(--yellow)')}
    </div>
    <section class="card"><h3>📈 Ventas · últimos 7 días</h3><div class="bars">${dias.map((t, i) =>
      `<div class="bar" title="${money(tot[i])}"><em>${tot[i] ? '$' + Math.round(tot[i]).toLocaleString('es-MX') : ''}</em><i class="${i === 6 ? 'today' : ''}" style="height:${tot[i] / max * 78}%"></i><small>${new Date(t).toLocaleDateString('es-MX', { weekday: 'short' }).slice(0, 3)}</small></div>`).join('')}</div></section>
    <section class="card"><h3>🏆 Más vendidos del mes</h3>${tops.map(([id, t], i) => {
      const p = S.productos.get(id);
      return p ? mini(p, `${t.cant} vendidos · ${money(t.imp)}`) : `<div class="mini"><div class="thumb"><div class="box"><div class="nofoto">${i + 1}</div></div></div><div><b>${esc(t.nombre)}</b><small>${t.cant} vendidos · ${money(t.imp)}</small></div></div>`;
    }).join('') || '<p class="empty">Aún sin ventas este mes</p>'}</section>
    <section class="card"><h3>⚠️ Por surtir</h3>${bajos.slice(0, 8).map(p => mini(p, estado(p) === 'agotado' ? 'Agotado' : `Quedan ${stockDe(p)}`)).join('') || '<p class="empty">Nada por surtir 🎉</p>'}</section>
  </div>`;
}

function vInventario() {
  const ests = [['', 'Todos'], ['ok', '✅ Con stock'], ['bajo', '⚠️ Bajo'], ['agotado', '❌ Agotados']];
  return `<div class="toolbar">
    <div class="search"><span>🔍</span><input id="q" type="search" placeholder="Buscar nombre, código o categoría" value="${esc(S.q)}" autocomplete="off"></div>
    <div class="chips" style="margin-top:8px">${chip('cat', '', '🌈 Todo', !S.cat)}${categorias().map(c => chip('cat', c, esc(c), S.cat === c)).join('')}</div>
    <div class="chips">${ests.map(([v, t]) => chip('est', v, t, S.est === v)).join('')}</div>
  </div><div id="grid" class="grid"></div>

function agregarCarrito(p, piezas = null, cant = 1) {
  let l = S.carrito.find(l => l.pid === p.id);
  if (esSet(p)) {
    const disp = new Set(p.piezas.filter(z => !z.vendida).map(z => z.id));
    const ids = (piezas || [...disp]).filter(id => disp.has(id));
    if (!ids.length) { toast('No hay piezas disponibles seleccionadas', 'warn'); return false; }
    if (!l) { l = { pid: p.id, piezas: [], cant: 0, precio: 0 }; S.carrito.push(l); }
    l.piezas = [...new Set([...l.piezas, ...ids])]; l.cant = l.piezas.length;

    const st = stockDe(p);

    if (!l) { l = { pid: p.id, piezas: null, cant: 0, precio: precioDe(p) }; S.carrito.push(l); }

async function ticketCanvas(v, t = S.tienda) {
  await document.fonts?.ready;
  const W = 576, P = 36, Z = 14, F = "'M PLUS Rounded 1c', sans-serif", FT = "'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif";

    wrap(s, W - 2 * P).forEach(l => { g.fillText(l, al === 'center' ? W / 2 : al === 'right' ? W - P : P, y); y += size * gap; });
  };
  const fila = (izq, der, { size = 22, w = 500, col = INKc, f = F } = {}) => {

    const dw = g.measureText(der).width, ls = wrap(izq, W - 2 * P - dw - 16);
    g.textAlign = 'right'; g.fillText(der, W - P, y);
    g.textAlign = 'left'; ls.forEach(l => { g.fillText(l, P, y); y += size * 1.35; });

  const corte = () => { y += 8; g.strokeStyle = '#b9a8d6'; g.lineWidth = 2; g.setLineDash([10, 8]); g.beginPath(); g.moveTo(P, y); g.lineTo(W - P, y); g.stroke(); g.setLineDash([]); y += 18; };

  if (t.mascota !== false) {
    try {

        : 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(AVATARS[k].replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" ')));
      const h = esImg(k) ? 150 : 130, w = h * im.naturalWidth / im.naturalHeight;

    } catch {}
  }
  linea(t.nombre || tiendaNombre(), { size: 38, w: 400, f: FT, col: PINK, gap: 1.25 });
  linea(t.eslogan, { size: 21, w: 700, col: '#7c3aed' });
  y += 4;
  linea(t.direccion, { size: 19, col: GRIS });
  linea([t.telefono && 'Tel. ' + t.telefono, t.whatsapp && 'WhatsApp ' + t.whatsapp].filter(Boolean).join(' · '), { size: 19, col: GRIS });

  fila('Fecha', fechaTxt(v.fecha), { size: 20 });
  if (v.usuario) fila('Atendió', v.usuario.split('@')[0], { size: 20 });
  if (v.cliente) fila('Cliente', v.cliente, { size: 20 });
  corte();
  v.items.forEach(it => {
    linea(it.nombre, { size: 22, w: 800, al: 'left', gap: 1.3 });
    fila(`${it.cant} × ${money(it.precio)}${it.piezasNum?.length ? ' · pzas #' + it.piezasNum.join(', #') : ''}`, money(it.importe), { size: 20, col: GRIS });

function parseFbCfg(t) {
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('No encontré el objeto { ... }');
  const json = t.slice(a, b + 1).replace(/\/\/.*$/gm, '').replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}');
  const o = JSON.parse(json);
  if (!o.apiKey || !o.projectId) throw new Error('Faltan apiKey o projectId');
  return o;
}

const refreshPz = (r, c) => { $('#pzArea', r).innerHTML = pzArea(c); bindPz(r, c); };
function bindPz(r, c) {
  const ph = $('.box.edit .ph', r), d = c.d; if (!ph) return;
  let st = null;
  const pos = e => { const b = ph.getBoundingClientRect(); return { x: r2(clamp((e.clientX - b.left) / b.width * 100, 0, 100)), y: r2(clamp((e.clientY - b.top) / b.height * 100, 0, 100)) }; };
  ph.onpointerdown = e => { const el = e.target.closest('.pz'); st = { el, id: el?.dataset.z, x: e.clientX, y: e.clientY, moved: false }; ph.setPointerCapture(e.pointerId); e.preventDefault(); };
  ph.onpointermove = e => {
    if (!st?.el) return;
    if (!st.moved && Math.hypot(e.clientX - st.x, e.clientY - st.y) > 6) st.moved = true;
    if (st.moved) { const z = d.piezas.find(z => z.id === st.id), p = pos(e); Object.assign(z, p); st.el.style.left = p.x + '%'; st.el.style.top = p.y + '%'; }
  };
  ph.onpointerup = e => {
    if (!st) return;
    const moved = st.moved || Math.hypot(e.clientX - st.x, e.clientY - st.y) > 6;
    if (st.el) { if (!moved) c.sel = c.sel === st.id ? null : st.id; }
    else if (!moved) { const z = { id: uid(), ...pos(e), nombre: '', precio: '', vendida: false }; d.piezas.push(z); c.sel = z.id; }
    st = null; refreshPz(r, c);
  };
  ph.onpointercancel = () => st = null;
  $('[data-ms]', r).oninput = e => { d.ms = num(e.target.value); ph.style.setProperty('--ms', d.ms); };
  $$('[data-pz]', r).forEach(i => i.oninput = () => { const z = d.piezas.find(z => z.id === c.sel); if (z) z[i.dataset.pz] = i.value; });
}

  },
  // editor
  tipo: a => { const c = ctx(); leerForm(c.d, sheetRoot()); c.d.tipo = a.dataset.v; if (c.d.tipo === 'set' && num(c.d.stockMin) > 1) c.d.stockMin = 1; drawSheet(); },
  galCover: a => {
    const c = ctx(), d = c.d, i = c.gal.findIndex(f => f.id === a.dataset.id); if (i < 0) return;
    const f = c.gal[i]; leerForm(d, sheetRoot());
    c.gal[i] = { id: uid(), pid: d.id, foto: d.foto, ar: d.ar, t: f.t, nuevo: true }; d.foto = f.foto; d.ar = f.ar;
    drawSheet(); if (esSet(d) && d.piezas.length) say('Nueva portada: acomoda las marcas sobre las piezas 👆');
  },
  galDel: a => {
    const c = ctx(), d = c.d, id = a.dataset.id; leerForm(d, sheetRoot());
    if (id) c.gal = c.gal.filter(f => f.id !== id);
    else if (c.gal.length) { const f = c.gal.shift(); d.foto = f.foto; d.ar = f.ar; }
    else d.foto = '';
    drawSheet();
  },
  verFoto: a => { const c = ctx(), p = S.productos.get(c.id); abrirVisor([p.foto, ...(c.gal || []).map(f => f.foto)].filter(Boolean), +a.dataset.i); },
  calcPrecio: () => { const c = ctx(), r = sheetRoot(); leerForm(c.d, r); c.d.precioVenta = r2(num(c.d.costo) * (1 + num(cfg.margen) / 100)); $('[data-f=precioVenta]', r).value = c.d.precioVenta; mgTxt(r, c.d); },
  pzSel: a => { const c = ctx(); c.sel = c.sel === a.dataset.id ? null : a.dataset.id; refreshPz(sheetRoot(), c); },
  pzToggle: () => { const c = ctx(), z = c.d.piezas.find(z => z.id === c.sel); z.vendida = !z.vendida; refreshPz(sheetRoot(), c); },
  pzDel: () => { const c = ctx(); c.d.piezas = c.d.piezas.filter(z => z.id !== c.sel); c.sel = null; refreshPz(sheetRoot(), c); },
  pzClear: () => { const c = ctx(); if (confirm('¿Borrar todas las marcas?')) { c.d.piezas = []; c.sel = null; refreshPz(sheetRoot(), c); } },
  guardar: async a => {
    const c = ctx(), d = c.d; leerForm(d, sheetRoot());
    d.nombre = d.nombre.trim();
    if (!d.nombre) return toast('Ponle nombre al producto', 'warn');
    if (esSet(d) && !d.piezas.length && !confirm('El set no tiene piezas marcadas en la foto. ¿Guardar así?')) return;
    ['costo', 'precioSugerido', 'precioVenta', 'stock', 'stockMin'].forEach(k => d[k] = num(d[k]));
    d.piezas.forEach(z => z.precio = z.precio === '' || z.precio == null ? '' : num(z.precio));
    if (esSet(d)) d.stock = stockDe(d);
    d.actualizado = Date.now(); a.disabled = true;
    const put = c.gal.filter(f => f.nuevo).map(({ nuevo, ...f }) => ({ ...f, pid: d.id }));
    const del = c.gal0.filter(id => !c.gal.some(f => f.id === id));
    try { await Ops.guardar(d, put, del); closeSheet(); toast('Guardado ✨'); say(c.nuevo ? '¡Nuevo producto en la tienda! 🎉' : '¡Cambios guardados! 💾'); }
    catch (e) { a.disabled = false; toast(errMsg(e), 'err'); }
  },
  // vender
  addRapido: a => { const p = S.productos.get(a.dataset.id); if (esSet(p)) abrirDetalle(p.id); else if (agregarCarrito(p)) renderTicket(); },
  cantL: a => {
    const l = S.carrito[a.dataset.i], p = S.productos.get(l.pid), n = l.cant + num(a.dataset.d);
    if (n > stockDe(p)) return toast(`Solo hay ${stockDe(p)} en stock`, 'warn');
    if (n < 1) S.carrito.splice(a.dataset.i, 1); else l.cant = n;
    saveCart(); renderTicket();
  },
  quitarL: a => { S.carrito.splice(a.dataset.i, 1); saveCart(); renderTicket(); },
  vaciar: () => { if (S.carrito.length && confirm('¿Vaciar el ticket?')) { S.carrito = []; saveCart(); renderTicket(); } },
  metodo: a => { S.cobro.metodo = a.dataset.v; $$('[data-act=metodo]').forEach(b => b.classList.toggle('on', b === a)); },
  cobrar: a => cobrar(a),
  vistaV: a => { cfg.vistaV = a.dataset.v; saveCfg(); $$('[data-act=vistaV]').forEach(b => b.classList.toggle('on', b === a)); renderRes(); },
  // ventas
  verVenta: a => abrirVenta(a.dataset.id),
  cancelarVenta: async a => {
    const v = S.ventas.find(x => x.id === ctx().id);
    if (!v || !confirm('¿Cancelar esta venta? El stock y las piezas regresarán al inventario.')) return;
    a.disabled = true;
    try { await Ops.cancelar(v); toast('Venta cancelada ↩️'); } catch (e) { a.disabled = false; toast(e.message, 'err'); }
  },
  verTicket: () => abrirTicket(S.ventas.find(x => x.id === ctx().id)),
  tkDescargar: async () => { const f = await tkArchivo(); descargar(f, f.name); },
  tkCompartir: async () => {
    try { const f = await tkArchivo(); if (navigator.canShare?.({ files: [f] })) await navigator.share({ files: [f], title: f.name }); else descargar(f, f.name); }
    catch (e) { if (e.name !== 'AbortError') toast(e.message, 'err'); }
  },
  guardarTienda: async a => {
    const t = leerTienda(); if (!t.nombre) return toast('Escribe el nombre de la tienda', 'warn');
    a.disabled = true;
    try { await Ops.guardarTienda(t); toast('Datos de la tienda guardados ✨'); say('¡Tu ticket quedó precioso! 🧾'); } catch (e) { toast(errMsg(e), 'err'); }
    a.disabled = false;
  },
  verEjemplo: () => abrirTicket(S.ventas.find(v => v.estado !== 'cancelada') || DEMO_VENTA(), leerTienda()),
  csvVentas: () => {
    const rows = [['Fecha', 'Folio', 'Estado', 'Producto', 'Tipo', 'Piezas', 'Cantidad', 'Costo unit.', 'Sugerido unit.', 'Precio unit.', 'Importe', 'Descuento venta', 'Total venta', 'Ganancia venta', 'Método', 'Cliente', 'Nota']];
    ventasRango().forEach(v => v.items.forEach((it, i) => rows.push([fechaTxt(v.fecha), v.id, v.estado, it.nombre, it.tipo, (it.piezasNum || []).join(' '), it.cant, it.costo, it.sugerido, it.precio, it.importe,
      i ? '' : v.descuento, i ? '' : v.total, i ? '' : v.ganancia, v.metodo, v.cliente, v.nota])));
    csv(rows, `ventas_${S.rango}_${hoyISO()}.csv`);
  },
  // ajustes
  avatar: a => { cfg.avatar = a.dataset.v; saveCfg(); render(); say(`¡Hola! Soy ${NOMBRES_AV[cfg.avatar]} ✨`); },
  modo: a => { cfg.modo = a.dataset.v; $$('[data-act=modo]').forEach(b => b.classList.toggle('on', b === a)); $('#fbBox').hidden = cfg.modo !== 'firebase'; },
  guardarModo: () => {
    try { if (cfg.modo === 'firebase') cfg.fb = parseFbCfg($('#fbCfg').value); cfg.modoManual = true; saveCfg(); location.reload(); }
    catch (e) { toast('Configuración inválida: ' + e.message, 'err'); }
  },
  logout: async () => { await FB.logout(); toast('Sesión cerrada'); go('inicio'); },
  resetPw: async () => {
    const e = $('#lgE').value.trim(); if (!e) return toast('Escribe tu correo primero', 'warn');
    try { await FB.reset(e); toast('Te enviamos un correo para restablecerla 📧'); } catch (er) { toast(ERR_AUTH[er.code] || er.message, 'err'); }
  },
  backup: async () => {
    const fotos = await DB.todasFotos();
    descargar(new Blob([JSON.stringify({ app: 'kawaii-stock', version: 2, fecha: new Date().toISOString(), productos: [...S.productos.values()], ventas: S.ventas,
      fotos, config: S.tienda.id ? [S.tienda] : [] })], { type: 'application/json' }), `respaldo_${hoyISO()}.json`);
  },
  csvInv: () => csv([['Nombre', 'Tipo', 'Categoría', 'Código', 'Stock', 'Piezas totales', 'Stock mínimo', 'Costo', 'Precio sugerido', 'Precio venta', 'Margen %', 'Notas'],
    ...[...S.productos.values()].map(p => [p.nombre, p.tipo, p.categoria, p.codigo, stockDe(p), esSet(p) ? p.piezas.length : '', p.stockMin, p.costo, p.precioSugerido, p.precioVenta, margen(p).toFixed(1), p.notas])], `inventario_${hoyISO()}.csv`),
  borrarLocal: async () => { if (confirm('¿Borrar TODOS los productos y ventas de este equipo? Descarga un respaldo antes.') && confirm('¿Seguro? No se puede deshacer.')) { await Local.borrarTodo(); toast('Datos borrados'); } }
};
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.li != null) {
    const l = S.carrito[t.dataset.li]; if (!l) return;
    l.precio = l.piezas ? num(t.value) / l.cant : num(t.value);
    $('#imp' + t.dataset.li).textContent = money(l.precio * l.cant); saveCart(); renderTotales();
  } else if (t.dataset.c) { S.cobro[t.dataset.c] = t.value; if (t.dataset.c === 'desc') renderTotales(); }
});
addEventListener('online', render);
addEventListener('offline', render);

/* ---------- Arranque ---------- */
(async function boot() {
  render();
  try {
    DB = cfg.modo === 'firebase' && cfg.fb ? FB : Local;
    await DB.init();
  } catch (e) {
    console.error(e);
    S.fatal = DB === FB ? `${e.message}. Revisa tu configuración o la conexión a internet.` : e.message;
  }
  render();
  setTimeout(() => say(S.productos.size ? `¡Hola! Tienes ${S.productos.size} productos ✨` : '¡Hola! Agreguemos tu primer producto ✨'), 600);
})();
</script>
</body>
</html>
