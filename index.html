const refreshPz = (r, c) => { $('#pzArea', r).innerHTML = pzArea(c); bindPz(r, c); };
function bindPz(r, c) {
  const ph = $('.box.edit .ph', r), d = c.d;
  $$('[data-pzn]', r).forEach(i => i.onchange = () => { const z = d.piezas.find(z => z.id === c.sel); if (z && !z.ap) { setCant(z, i.value); refreshPz(r, c); } });
  if (!ph) return bindPzFoto(r, c);
  let st = null;
  const pos = e => { const b = ph.getBoundingClientRect(); return { x: r2(clamp((e.clientX - b.left) / b.width * 100, 0, 100)), y: r2(clamp((e.clientY - b.top) / b.height * 100, 0, 100)) }; };
  ph.onpointerdown = e => { const el = e.target.closest('.pz'); st = { el, id: el?.dataset.z, x: e.clientX, y: e.clientY, moved: false }; ph.setPointerCapture(e.pointerId); e.preventDefault(); };
  ph.onpointermove = e => {
    if (!st?.el) return;
    if (!st.moved && Math.hypot(e.clientX - st.x, e.clientY - st.y) > 6) st.moved = true;
    if (st.moved) { const z = d.piezas.find(z => z.id === st.id), p = pos(e); Object.assign(z, p); st.el.style.left = p.x + '%'; st.el.style.top = p.y + '%'; }
  };
  ph.onpointerup = e => {
    if (!st) return;
    const moved = st.moved || Math.hypot(e.clientX - st.x, e.clientY - st.y) > 6;
    if (st.el) { if (!moved) c.sel = c.sel === st.id ? null : st.id; }
    else if (!moved) { const z = { id: uid(), ...pos(e), nombre: '', precio: '', vendida: false }; d.piezas.push(z); c.sel = z.id; }
    st = null; refreshPz(r, c);
  };
  ph.onpointercancel = () => st = null;
  $('[data-ms]', r).oninput = e => { d.ms = num(e.target.value); ph.style.setProperty('--ms', d.ms); };
  bindPzFoto(r, c);
}
function bindPzFoto(r, c) {
  const d = c.d;
  $$('[data-pz]', r).forEach(i => i.oninput = () => { const z = d.piezas.find(z => z.id === c.sel); if (z) z[i.dataset.pz] = i.value; });
  $$('[data-pzfoto]', r).forEach(i => i.onchange = async () => {
    const f = i.files[0]; i.value = ''; const z = d.piezas.find(z => z.id === c.sel); if (!f || !z) return;
    if (1 + c.gal.length >= maxFotos(d)) return toast(`Máximo ${maxFotos(d)} fotos por producto`, 'warn');
    const crop = await recortar(f); if (!crop) return;
    toast('Procesando foto… 📸');
    try { const img = await procesarImagen(f, crop), id = uid(); c.gal.push({ id, pid: d.id, ...img, t: Date.now(), nuevo: true }); z.fid = id; leerForm(d, sheetRoot()); drawSheet(); say(`¡Foto de la pieza #${d.piezas.indexOf(z) + 1} lista! 📸`); }
    catch (e) { toast(e.message, 'err'); }
  });
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.li != null) {
    const l = S.carrito[t.dataset.li]; if (!l) return;
    l.precio = l.piezas ? num(t.value) / l.cant : num(t.value);
    $('#imp' + t.dataset.li).textContent = money(l.precio * l.cant); saveCart(); renderTotales();
  } else if (t.dataset.c) {
    const k = t.dataset.c;
    if (k.startsWith('mix.')) S.cobro.mix[k.slice(4)] = t.value; else S.cobro[k] = t.value;
    if (k === 'cliente') { const c = buscarCliente(t.value), tel = $('[data-c=tel]'); if (c?.telefono && tel && !tel.value) { tel.value = S.cobro.tel = c.telefono; } }
    if (['desc', 'recibido', 'canal'].includes(k) || k.startsWith('mix.')) renderTotales();
  }
});
addEventListener('online', render);
addEventListener('offline', render);

/* ---------- Catálogo público (index.html?catalogo) ---------- */
const desdePub = d => ({ id: d.id, nombre: d.nombre, categoria: d.categoria, codigo: d.codigo, tipo: d.tipo, foto: d.foto, ar: d.ar, ms: d.ms, precioVenta: d.precio, precioSugerido: 0,
  stock: d.disponible, piezas: (d.piezas || []).map((z, i) => ({ id: 'z' + i, x: z.x, y: z.y, vendida: !!z.v, ...(z.c > 1 ? { cant: z.c } : {}), f: z.f, nombre: z.n || '', precio: z.p ?? '' })) });
async function bootCatalogo() {
  document.body.classList.add('catalogo'); S.view = 'catalogo';
  $('#main').innerHTML = `<div class="loader">${mascota('lg')}Cargando catálogo…</div>`;
  const conf = FIREBASE_CONFIG || cfg.fb, falla = m => $('#main').innerHTML = `<div class="card login">${mascota('lg', 'sad')}<h2>Catálogo no disponible</h2><p>${esc(m)}</p></div>`;
  if (!conf) return falla('Esta tienda aún no tiene catálogo en línea.');
  try {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK}/`;
    const [A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js')]);
    const db = F.getFirestore(A.initializeApp(conf, 'catalogo'));
    Object.assign(S, { catF: F, catDb: db, catMedia: new Map() });
    const err = e => falla(e.code === 'permission-denied' ? 'El catálogo aún no está publicado.' : e.message);
    let listo = 0; const pinta = () => { if (listo === 3) renderCatalogo(); };
    F.onSnapshot(F.doc(db, 'catalogo', '_tienda'), s => { S.catTienda = s.data() || {}; if (NOMBRES_AV[S.catTienda.avatar]) cfg.avatar = S.catTienda.avatar; listo |= 1; pinta(); }, err);
    F.onSnapshot(F.query(F.collection(db, 'catalogo'), F.where('tipo', 'in', ['set', 'individual'])), s => {
      S.productos = new Map(s.docs.map(d => desdePub(d.data())).map(p => [p.id, p])); listo |= 2; pinta();
    }, err);
  } catch (e) { falla('Revisa tu conexión a internet.'); }
}
/* Catálogo web: mismo lenguaje visual que el PDF ("Candy Ledger"), en una sola página continua */
const MEDIA = id => id + '__f';
const CW_ESC = ['linear-gradient(135deg,#ff4fa3,#7c3aed)', 'linear-gradient(135deg,#22d3ee,#7c3aed)', 'linear-gradient(135deg,#ff9f43,#ff4fa3)', 'linear-gradient(135deg,#7c3aed,#22d3ee)'];
function rafagaSVG(txt, sub, idx, R = 100) {
  const pts = (r, s) => Array.from({ length: 26 }, (_, i) => { const a = i * Math.PI / 13 - Math.PI / 2, k = i % 2 ? .66 + ((s * 7 + i * 13) % 10) / 100 : .92 + ((s * 3 + i * 11) % 9) / 100; return `${r2(Math.cos(a) * r * k)},${r2(Math.sin(a) * r * k * .86)}`; }).join(' ');
  const lin = Array.from({ length: 10 }, (_, i) => { const a = i * Math.PI / 5 + .3, r0 = R * 1.02, r1 = R * (1.16 + (i % 3) * .07); return `<line x1="${r2(Math.cos(a) * r0)}" y1="${r2(Math.sin(a) * r0 * .86)}" x2="${r2(Math.cos(a) * r1)}" y2="${r2(Math.sin(a) * r1 * .86)}"/>`; }).join('');
  const z = Math.min(R * .44, R * 1.24 / (txt.length * .62)), sz = R * .22, ty = sub ? -8 : 2, gira = idx % 2 ? 8 : -8;
  return `<svg class="cw-burst" viewBox="-130 -130 260 260" aria-label="${esc(txt)}${sub ? ' ' + sub : ''}"><g stroke="#2a1650" stroke-width="4" stroke-linecap="round">${lin}</g>
    <polygon points="${pts(R, idx)}" fill="#2a1650" transform="translate(7 7)"/><polygon points="${pts(R, idx)}" fill="${idx % 4 === 1 ? '#ffe14f' : '#ffd23f'}" stroke="#2a1650" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="${pts(R * .62, idx + 5)}" fill="rgba(255,255,255,.55)"/>
    <g transform="translate(0 ${ty}) rotate(${gira})" font-family="'Mochiy Pop One','M PLUS Rounded 1c',sans-serif" text-anchor="middle" dominant-baseline="central" stroke-linejoin="round">
      <text x="4" y="5" font-size="${r2(z)}" fill="#2a1650">${esc(txt)}</text><text font-size="${r2(z)}" fill="#ff4fa3" stroke="#2a1650" stroke-width="9" paint-order="stroke">${esc(txt)}</text>
      <text x="-1" y="-2" font-size="${r2(z)}" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.6">${esc(txt)}</text>
      ${sub ? `<text y="${r2(z * .62 + sz * .4)}" font-size="${r2(sz)}" fill="#fff" stroke="#2a1650" stroke-width="6" paint-order="stroke">${sub}</text>` : ''}</g></svg>`;
}
const cwChat = '<svg class="cw-chat" viewBox="-12 -12 24 26" aria-hidden="true"><circle r="11" fill="currentColor"/><path d="M-6 6.6-10.5 11.5-1 9.4z" fill="currentColor"/><g fill="#fff"><circle cx="-4.2" r="1.5"/><circle r="1.5"/><circle cx="4.2" r="1.5"/></g></svg>';
const cwBtn = (t, txt, label = 'Lo quiero', cls = '') => t.whatsapp ? `<a class="cw-btn ${cls}" target="_blank" rel="noopener" href="${waLink(t.whatsapp, msjWA(t, txt))}">${cwChat}<span>${label}</span></a>` : '';
const cwPills = a => `<div class="cw-pills">${a.map(([txt, c]) => `<span class="cw-pill ${c || ''}">${esc(txt)}</span>`).join('')}</div>`;
function cwFoto(p, cls = '') {
  if (!p.foto) return `<div class="cw-foto vacia ${cls}"><b>${esc((p.nombre.trim()[0] || '?').toUpperCase())}</b><small>foto próximamente</small></div>`;
  return `<div class="cw-foto ${cls}">${fotoHTML(p).replace('<img src=', `<img data-mf="${p.id}" src=`)}</div>`;
}
function cwInd(p, idx, t) {
  const st = stockDe(p), der = idx % 2;
  return `<article class="cw-ind${der ? ' der' : ''}" data-cwm="${p.id}">
    <div class="cw-tile" data-act="cwVer" data-id="${p.id}"><div class="cw-esc" style="background:${CW_ESC[idx % 4]}"></div>${cwFoto(p)}${rafagaSVG(precioCorto(precioDe(p)), '', idx)}</div>
    <div class="cw-txt"><small class="cw-cat">${esc((p.categoria || 'Novedad').toUpperCase())}</small><h3>${esc(p.nombre)}</h3><div class="cw-linea"></div>
      ${cwPills([st === 1 ? ['¡Última pieza!', 'rosa'] : [`${st} disponibles`], ...(p.codigo ? [[`#${p.codigo}`, 'blanca']] : [])])}
      ${cwBtn(t, `${p.nombre}${p.codigo ? ' (' + p.codigo + ')' : ''} · ${precioCorto(precioDe(p))}`)}</div></article>`;
}
function cwPieza(p, z, i, t) {
  const vend = z.vendida && !z.ap, ap = z.vendida && z.ap, H = 1000, W = 1000 * (p.ar || 1), m = Math.min(W, H), s = clamp(W * (p.ms || 9) / 100 * 2.8, m * .16, m * .6);
  const sx = clamp(z.x / 100 * W - s / 2, 0, W - s), sy = clamp(z.y / 100 * H - s / 2, 0, H - s), pc = (a, b) => b > 0 ? r2(a / b * 100) : 50;
  const crop = p.foto ? `background-size:${r2(W / s * 100)}% ${r2(H / s * 100)}%;background-position:${pc(sx, W - s)}% ${pc(sy, H - s)}%` : '';
  const tag = !z.vendida && t.whatsapp ? 'a' : 'div', href = tag === 'a' ? ` target="_blank" rel="noopener" href="${waLink(t.whatsapp, msjWA(t, `la pieza #${i + 1}${z.nombre ? ' (' + z.nombre + ')' : ''} del set ${p.nombre} · ${precioCorto(precioPieza(p, z))}`))}"` : '';
  return `<${tag} class="cw-pz${vend ? ' vend' : ap ? ' ap' : ''}"${href}><span class="cw-pzimg${p.foto ? '' : ' vacia'}" style="${crop}">${p.foto ? '' : '#' + (i + 1)}${z.f ? `<img data-mpz="${i}" alt="" hidden>` : ''}
      ${z.vendida ? `<em class="cw-sello"><i>${ap ? 'APARTADA' : 'VENDIDA'}</i></em>` : ''}</span><span class="cw-num">${i + 1}</span>${dispPz(z) > 1 ? `<span class="cw-xn">×${dispPz(z)}</span>` : ''}
    <b>${esc(z.nombre || `Pieza ${i + 1}`)}</b><span class="cw-pp">${vend ? 'Vendida' : ap ? 'Apartada' : precioCorto(precioPieza(p, z))}</span>${tag === 'a' ? cwChat : ''}</${tag}>`;
}
function cwSet(p, idx, t) {
  const st = stockDe(p);
  return `<article class="cw-set" data-cwm="${p.id}" style="--simg:url('${p.foto}')">
    <div class="cw-shead"><div class="cw-txt"><small class="cw-cat">${esc((p.categoria || 'Novedad').toUpperCase())} · SET</small><h3>${esc(p.nombre)}</h3>
      ${cwPills([[`Set de ${p.piezas.length} piezas`], st === 1 ? ['¡Última pieza!', 'rosa'] : [`${st} disponibles`], ...(p.codigo ? [[`#${p.codigo}`, 'blanca']] : [])])}
      ${cwBtn(t, `el set ${p.nombre}${p.codigo ? ' (' + p.codigo + ')' : ''} · ${precioCorto(precioPieza(p, {}))} c/u`)}</div>${rafagaSVG(precioCorto(precioPieza(p, {})), 'c/u', idx)}</div>
    <div class="cw-sfoto" data-act="cwVer" data-id="${p.id}"><div class="cw-esc" style="background:${CW_ESC[idx % 4]}"></div>${cwFoto(p, 'grupal')}</div>
    <h4 class="cw-titular"><span>PIEZAS DEL SET</span><small>${st} de ${totPz(p)} disponibles</small></h4>
    <div class="cw-pzs">${p.piezas.map((z, i) => cwPieza(p, z, i, t)).join('')}</div></article>`;
}
function renderCatalogo() {
  const t = S.catTienda || {}, nom = t.nombre || 'Catálogo', n = [...S.productos.values()].filter(p => stockDe(p) > 0).length;
  document.title = `${nom} · Catálogo`;
  $('#main').innerHTML = `<div class="cw">
    <header class="cw-hero"><div class="cw-in">
      <div class="cw-logo"><img src="${t.logo || LOGO_DEF}" alt="${esc(nom)}"></div>
      <div class="cw-tit"><h1>CATÁLOGO</h1><p class="cw-nom">${esc(nom)}</p>${t.eslogan ? `<p class="cw-esl">${esc(t.eslogan)}</p>` : ''}
        <span class="cw-pill amarilla">${capital(new Date().toLocaleDateString('es-MX', { month: 'long', year: 'numeric' }))} · ${n} producto${n === 1 ? '' : 's'}</span></div>
      <div class="cw-mid"><img src="${IMG.m03}" alt=""><span class="cw-globo">${t.whatsapp ? '¡Elige tu favorito y pídelo por WhatsApp!' : '¡Elige tu favorito!'}</span></div></div></header>
    <div class="cw-in">
      <section class="cw-como">${[['1', 'Elige tu', 'favorito'], ['2', 'Toca', '«Lo quiero»'], ['3', 'Confirma por', 'WhatsApp']].map(([k, a, b]) => `<div><span>${k}</span><p>${a}<b>${b}</b></p></div>`).join('')}</section>
      <div class="cw-bar"><div class="search"><span>🔍</span><input id="q" type="search" placeholder="Buscar en el catálogo" value="${esc(S.q)}" autocomplete="off"></div><div class="chips" id="catChips"></div></div>
      <div id="cwLista"></div>
      <section class="cw-fin"><div class="cw-logo"><img src="${t.logo || LOGO_DEF}" alt=""></div><div><h2>¡Gracias por visitarnos!</h2>
        ${[t.mensaje, t.direccion && '📍 ' + t.direccion, t.redes].filter(Boolean).map(m => `<p>${esc(m)}</p>`).join('')}
        ${t.whatsapp ? `<a class="cw-btn grande" target="_blank" rel="noopener" href="${waLink(t.whatsapp, `Hola ${nom} 👋`)}">${cwChat}<span>Escríbenos por WhatsApp</span></a>` : ''}</div>
        <img class="cw-adios" src="${IMG.m11}" alt=""></section></div>
    <footer class="cw-pie"><div class="cw-in">${t.whatsapp ? `<a target="_blank" rel="noopener" href="${waLink(t.whatsapp, `Hola ${nom} 👋, vi su catálogo y me interesa…`)}">${cwChat}<span><small>PEDIDOS POR WHATSAPP</small><b>${esc(t.whatsapp)}</b></span></a>` : `<b>${esc(nom)}</b>`}
      ${t.redes ? `<span class="cw-redes">${esc(t.redes)}</span>` : ''}<img src="${IMG.m09}" alt=""></div></footer></div>`;
  $('#q').oninput = e => { S.q = e.target.value; renderCatGrid(); };
  renderCatGrid();
}
let cwObs = null;
function renderCatGrid() {
  const t = S.catTienda || {}, ps = [...S.productos.values()].filter(p => stockDe(p) > 0), cats = [...new Set(ps.map(p => p.categoria).filter(Boolean))].sort();
  $('#catChips').innerHTML = chip('cCat', '', '🌈 Todo', !S.cat) + cats.map(c => chip('cCat', c, esc(c), S.cat === c)).join('');
  const q = S.q.trim().toLowerCase(), vis = ps.filter(p => (!S.cat || p.categoria === S.cat) && (!q || [p.nombre, p.codigo, p.categoria].some(x => String(x || '').toLowerCase().includes(q))))
    .sort((a, b) => (a.categoria || '').localeCompare(b.categoria || '') || a.nombre.localeCompare(b.nombre));
  const ind = vis.filter(p => !esSet(p)), sets = vis.filter(esSet);
  $('#cwLista').innerHTML = (ind.length ? `<h2 class="cw-titular"><span>PIEZAS INDIVIDUALES</span><small>${ind.length}</small></h2>${ind.map((p, i) => cwInd(p, i, t)).join('<div class="cw-sep"></div>')}` : '')
    + (sets.length ? `<h2 class="cw-titular"><span>SETS Y COLECCIONES</span><small>${sets.length}</small></h2>${sets.map((p, i) => cwSet(p, i, t)).join('')}` : '')
    || `<div class="empty">${mascota('lg')}<p>${ps.length ? 'Sin coincidencias 🔎' : 'Pronto tendremos productos aquí ✨'}</p></div>`;
  cwObs ??= 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { cwObs.unobserve(e.target); cwMedia(e.target.dataset.cwm); } }), { rootMargin: '900px 0px' }) : null;
  $$('[data-cwm]').forEach(el => cwObs ? cwObs.observe(el) : cwMedia(el.dataset.cwm));
}
function cwMedia(pid) {
  if (!S.catMedia.has(pid)) S.catMedia.set(pid, S.catF.getDoc(S.catF.doc(S.catDb, 'catalogo', MEDIA(pid))).then(s => s.data() || {}, () => ({})));
  return S.catMedia.get(pid).then(d => {
    const el = $(`[data-cwm="${pid}"]`); if (!el) return d;
    if (d.f) { $$('img[data-mf]', el).forEach(i => i.src = d.f); el.style.setProperty('--simg', `url('${d.f}')`); }
    $$('img[data-mpz]', el).forEach(i => { const u = d.pz?.[i.dataset.mpz]; if (u) { i.src = u; i.hidden = false; } });
    return d;
  });
}
Object.assign(ACT, {
  cCat: a => { S.cat = a.dataset.v; renderCatGrid(); },
  cwVer: async a => { const p = S.productos.get(a.dataset.id); if (!p?.foto) return; const d = await cwMedia(p.id); abrirVisor([d.f || p.foto, ...Object.values(d.pz || {})]); }
});

/* ---------- Arranque ---------- */
(async function boot() {
  if (MODO_CATALOGO) return bootCatalogo();
  render();
  try {
    DB = cfg.modo === 'firebase' && cfg.fb ? FB : Local;
    await DB.init();
  } catch (e) {
    console.error(e);
    S.fatal = DB === FB ? `${e.message}. Revisa tu configuración o la conexión a internet.` : e.message;
  }
  render();
  setTimeout(() => say(S.productos.size ? `¡Hola! Tienes ${S.productos.size} productos ✨` : '¡Hola! Agreguemos tu primer producto ✨'), 600);
})();
</script>
